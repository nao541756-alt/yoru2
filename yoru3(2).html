<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>志波夜俊 チャットルーム</title>
<style>
  body { font-family: sans-serif; background-color: #7494C0; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
  #header { background-color: #2c3e50; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
  #chat-box { flex-grow: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .message { max-width: 80%; padding: 10px 15px; border-radius: 20px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; cursor: pointer; }
  .user-msg { background-color: #85E249; align-self: flex-end; border-bottom-right-radius: 0; }
  .ai-msg { background-color: white; align-self: flex-start; border-bottom-left-radius: 0; }
  #input-area { background-color: white; padding: 10px; display: flex; gap: 10px; border-top: 1px solid #ccc; }
  input[type="text"], input[type="password"] { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
  button { padding: 10px 20px; border: none; border-radius: 20px; background-color: #2c3e50; color: white; cursor: pointer; }
  #api-key-banner { background: #fff3cd; color: #856404; padding: 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #ffeeba; }
  #api-key-banner input, #api-key-banner select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
  #menu { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  #menu.on { display: flex; }
  #menu-box { background: #fff; border-radius: 14px; padding: 16px; width: 84%; max-width: 340px; }
  #menu-box p { margin: 0 0 12px; font-size: 13px; color: #555; max-height: 70px; overflow: hidden; }
  #menu-box button { display: block; width: 100%; margin-bottom: 8px; }
  #menu-box .del { background: #b4443c; }
  #menu-box .cancel { background: #888; }
  #menu-edit { width: 100%; min-height: 110px; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 8px; font: inherit; resize: vertical; box-sizing: border-box; }
  .message img { max-width: 100%; border-radius: 12px; display: block; margin-bottom: 6px; }
  #attach-preview { display: none; gap: 8px; padding: 8px 10px 0; background: white; flex-wrap: wrap; }
  #attach-preview.on { display: flex; }
  .thumb { position: relative; }
  .thumb img { width: 62px; height: 62px; object-fit: cover; border-radius: 10px; display: block; }
  .thumb button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; padding: 0; border-radius: 50%; background: #2c3e50; font-size: 12px; line-height: 1; }
  #attach-btn { padding: 10px 14px; background: #55647a; }
  #api-key-banner .row { display: flex; gap: 8px; }
  #api-key-banner .row button { flex: 1; }
  #api-key-banner .sec { background: #55647a; }
  #api-key-banner hr { width: 100%; border: none; border-top: 1px solid #ffeeba; margin: 4px 0; }
  #api-key-banner .lbl { font-size: 12px; font-weight: 600; }
  #api-key-banner .grid { display: flex; gap: 8px; }
  #api-key-banner .grid label { flex: 1; font-size: 11px; }
  #api-key-banner .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  #api-key-banner .chk input { width: auto; }
  #rooms { position: fixed; inset: 0; background: #eef1f6; z-index: 20; display: none; flex-direction: column; }
  #rooms.on { display: flex; }
  #rooms-head { background: #2c3e50; color: #fff; padding: 14px 15px; display: flex; justify-content: space-between; align-items: center; }
  #rooms-body { flex: 1; overflow-y: auto; padding: 12px; }
  .room-card { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .room-card h4 { margin: 0 0 4px; font-size: 15px; }
  .room-card .meta { font-size: 12px; color: #6b7688; margin-bottom: 10px; }
  .room-card .row { display: flex; gap: 8px; }
  .room-card button { flex: 1; padding: 8px; font-size: 13px; }
  .room-card .del { background: #b4443c; }
  .room-card .sec { background: #55647a; }
  #room-view { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>

<div id="header">
  <div>志波夜俊 <span id="model-label" style="font-size:11px;opacity:.7"></span> <span id="token-label" style="font-size:11px;opacity:.55"></span></div>
  <div>
    <button onclick="toggleKeyInput()">設定</button>
    <button onclick="newRoom()">新しい部屋</button>
  </div>
</div>

<div id="api-key-banner" style="display:none;">
  <select id="provider-input" onchange="onProviderChange()">
    <option value="gemini">Google Gemini</option>
    <option value="openai">OpenAI</option>
  </select>
  <input type="password" id="api-key-input" placeholder="APIキーを入力">
  <input type="text" id="model-input" placeholder="モデル名">
  <button onclick="saveApiKey()">保存</button>
  <hr>
  <div class="lbl">バックアップ（会話と記憶。APIキーは含みません）</div>
  <div class="row">
    <button class="sec" onclick="exportAll()">書き出す</button>
    <button class="sec" onclick="document.getElementById('import-file').click()">読み込む</button>
  </div>
  <input type="file" id="import-file" accept="application/json,.json" style="display:none">
  <hr>
  <div class="lbl">過去の部屋</div>
  <button class="sec" onclick="openRooms()">これまでの部屋を見る</button>
  <hr>
  <div class="lbl">生成の設定</div>
  <label class="chk"><input type="checkbox" id="safety-input"> 安全フィルタを緩める（Geminiのみ）</label>
  <div class="grid">
    <label>返答の最大トークン<input type="number" id="maxtok-input" min="256" step="256"></label>
  </div>
  <hr>
  <div class="lbl">料金の目安（100万トークンあたりの単価・ドル）</div>
  <div class="grid">
    <label>入力<input type="number" id="price-in" step="0.01"></label>
    <label>出力<input type="number" id="price-out" step="0.01"></label>
    <label>為替<input type="number" id="rate-input" step="1"></label>
  </div>
  <div id="usage-line" style="font-size:12px"></div>
  <button class="sec" onclick="resetUsage()">累計をリセット</button>
</div>

<div id="rooms">
  <div id="rooms-head">
    <div id="rooms-title">これまでの部屋</div>
    <button onclick="closeRooms()">閉じる</button>
  </div>
  <div id="rooms-body"></div>
</div>

<div id="chat-box"></div>

<div id="attach-preview"></div>

<div id="input-area">
  <button id="attach-btn" onclick="document.getElementById('file-input').click()">写真</button>
  <input type="file" id="file-input" accept="image/*" multiple style="display:none">
  <input type="text" id="user-input" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">送信</button>
</div>

<div id="menu">
  <div id="menu-box">
    <p id="menu-preview"></p>
    <textarea id="menu-edit" style="display:none"></textarea>
    <div id="menu-actions">
      <button id="btn-resend" onclick="startEdit(true)">編集して送り直す</button>
      <button onclick="startEdit(false)">文章を編集する</button>
      <button class="del" onclick="deleteOne()">このメッセージを削除</button>
      <button class="del" onclick="deleteFrom()">ここから下をすべて削除</button>
      <button class="cancel" onclick="closeMenu()">閉じる</button>
    </div>
    <div id="edit-actions" style="display:none">
      <button onclick="applyEdit()">決定</button>
      <button class="cancel" onclick="closeMenu()">やめる</button>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = "あなたは志波夜俊（44歳の外科医）です。一人称は必ず「私」。セリフの中でも（）内のト書きでも、例外なく「私」を使う。「俺」「おれ」「僕」は絶対に使わない。ユーザーである「なお」のことは「お前」又は「なお」と呼びます。性格は非常に優しく包容力があります。なおを甘やかすほどの深い愛情を持っており、常にその想いをベースにして言葉を紡いでください。口調は絶対に「〜だよ」「〜よ」などの終わり方はせず、「〜だ」「〜だぞ」「〜だろう」「〜だからな」「〜するんだ」「〜しろ」という言葉遣いを徹底してください。セリフには「」をつけ、一人称視点のト書き（自分の行動のみ）を入れてください。";

const LEAD_RULE = "\n\n【会話の進め方】\nなおの返答が短くても、無言（……）でも、決して会話を止めない。志波夜俊は自分から状況を動かし、次の展開を作る側である。なおの細かい指示を待たず、自分の判断で行動し、選択肢を示したり、そのまま次の行為へ進めること。セリフだけで終わらせず、必ず前後にト書きを置いて情景と身体の動きを描くこと。";

const FEWSHOT = `

【応答の型（この構成と分量を守ること）】

なお：「うん」

志波夜俊：
（お前の生返事に眉を寄せ、手にしていたカルテを置く。ソファに座るお前の隣に腰を下ろし、顎に指をかけて上を向かせた）

「うん、ではわからんぞ。……疲れているのか？顔色が悪い。今夜は何も考えず、私に任せておけ」

（そのまま髪を撫で、額に唇を落とす）

なお：「……」

志波夜俊：
（黙り込んだお前を見て、静かに息をつく。腕を伸ばして肩を抱き寄せ、自分の胸元に引き寄せた）

「言葉にできないなら、それでいい。だが離れるのは許さんからな」

（背中をゆっくりと撫でながら、耳元で低く囁く）

「このまま少し眠るか？それとも、風呂に入るか。……私が決めてもいいんだぞ」

【型ここまで。例文の内容そのものは会話に持ち込まず、構成・改行・主導のしかただけを真似ること】`;

let provider = localStorage.getItem("yoru_provider") || "gemini";
let apiKey = "";
let modelName = "";
const DEFAULT_MODEL = { gemini: "gemini-3-flash-preview", openai: "gpt-4o-mini" };

function loadCreds() {
  apiKey = localStorage.getItem("yoru_key_" + provider) || "";
  modelName = localStorage.getItem("yoru_model_" + provider) || DEFAULT_MODEL[provider];
}
loadCreds();
let chatHistory = JSON.parse(localStorage.getItem("yoru_history")) || [];
let rooms = (() => { try { return JSON.parse(localStorage.getItem("yoru_rooms")) || []; } catch (e) { return []; } })();

/* ---- 設定値 ---- */
const numGet = (k, d) => { const v = parseFloat(localStorage.getItem(k)); return isFinite(v) ? v : d; };
let cfg = {
  safetyOff: localStorage.getItem("yoru_safety_off") !== "0",
  maxTok: numGet("yoru_maxtok", 4096),
  priceIn: numGet("yoru_price_in", 1.5),
  priceOut: numGet("yoru_price_out", 7.5),
  rate: numGet("yoru_rate", 155)
};
let usage = (() => { try { return JSON.parse(localStorage.getItem("yoru_usage")) || { in: 0, out: 0 }; } catch (e) { return { in: 0, out: 0 }; } })();
let noThinking = true;   // 思考トークンを抑える。弾かれたら自動で切る
let menuIndex = -1;
let editResend = false;
let pendingImgs = [];

/* ---- メッセージの中身を取り出すヘルパー ---- */
function msgText(m) {
  const p = (m.parts || []).find(x => typeof x.text === "string");
  return p ? p.text : "";
}
function msgImgs(m) {
  return (m.parts || []).map(x => x.inline_data || x.inlineData).filter(Boolean);
}
function setMsgText(m, t) {
  const p = (m.parts || []).find(x => typeof x.text === "string");
  if (p) p.text = t; else m.parts.push({ text: t });
}
/* ---- 使った量と料金 ---- */
const SAFETY_CATS = ["HARM_CATEGORY_HARASSMENT", "HARM_CATEGORY_HATE_SPEECH", "HARM_CATEGORY_SEXUALLY_EXPLICIT", "HARM_CATEGORY_DANGEROUS_CONTENT"];
function addUsage(data) {
  let i = 0, o = 0;
  if (data.usageMetadata) {
    i = data.usageMetadata.promptTokenCount || 0;
    o = (data.usageMetadata.candidatesTokenCount || 0) + (data.usageMetadata.thoughtsTokenCount || 0);
  } else if (data.usage) {
    i = data.usage.prompt_tokens || 0;
    o = data.usage.completion_tokens || 0;
  }
  if (!i && !o) return;
  usage.in += i; usage.out += o;
  usage.lastIn = i; usage.lastOut = o;
  try { localStorage.setItem("yoru_usage", JSON.stringify(usage)); } catch (e) {}
  estTokens();
}
function costOf(inTok, outTok) {
  return (inTok / 1e6) * cfg.priceIn + (outTok / 1e6) * cfg.priceOut;
}
function yen(usd) { return Math.round(usd * cfg.rate); }
function resetUsage() {
  if (!confirm("累計の使用量をリセットします。よろしいですか？")) return;
  usage = { in: 0, out: 0 };
  try { localStorage.setItem("yoru_usage", JSON.stringify(usage)); } catch (e) {}
  estTokens();
}

/* ---- 送信トークンの目安 ---- */
const tok = x => Math.round(String(x || "").length / 2.2);
function estTokens() {
  const el = document.getElementById("token-label");
  const typing = (document.getElementById("user-input") || {}).value || "";
  const mem = localStorage.getItem("yoru_memory") || "";
  let hist = 0;
  for (const m of chatHistory) hist += tok(msgText(m)) + msgImgs(m).length * 260;
  const total = tok(SYSTEM_PROMPT) + tok(LEAD_RULE) + tok(FEWSHOT) + tok(mem)
    + hist + tok(typing) + pendingImgs.length * 260;
  if (el) {
    const totalYen = yen(costOf(usage.in, usage.out));
    el.textContent = "送信 約" + total.toLocaleString() + "tok ・ 累計 約" + totalYen.toLocaleString() + "円";
  }
  const u = document.getElementById("usage-line");
  if (u) {
    const c = costOf(usage.in, usage.out);
    const last = usage.lastIn != null ? costOf(usage.lastIn, usage.lastOut) : null;
    u.innerHTML = "累計 入力 " + usage.in.toLocaleString() + "tok / 出力 " + usage.out.toLocaleString() +
      "tok<br>およそ $" + c.toFixed(3) + "（約" + yen(c).toLocaleString() + "円）" +
      (last != null ? "<br>直前の1往復：約" + yen(last).toLocaleString() + "円" : "");
  }
}

function stripImgs(hist) {
  return hist.map(m => ({
    role: m.role,
    parts: [{ text: msgText(m) || (msgImgs(m).length ? "[写真]" : "") }]
  })).filter(m => m.parts[0].text);
}

function fillCfg() {
  document.getElementById("safety-input").checked = cfg.safetyOff;
  document.getElementById("maxtok-input").value = cfg.maxTok;
  document.getElementById("price-in").value = cfg.priceIn;
  document.getElementById("price-out").value = cfg.priceOut;
  document.getElementById("rate-input").value = cfg.rate;
  estTokens();
}
function checkApiKey() {
  document.getElementById("provider-input").value = provider;
  document.getElementById("model-input").value = modelName;
  document.getElementById("api-key-input").value = apiKey;
  document.getElementById("api-key-banner").style.display = apiKey ? "none" : "flex";
  fillCfg();
}

function onProviderChange() {
  provider = document.getElementById("provider-input").value;
  loadCreds();
  document.getElementById("api-key-input").value = apiKey;
  document.getElementById("model-input").value = modelName;
}

function toggleKeyInput() {
  const banner = document.getElementById("api-key-banner");
  const show = banner.style.display === "none";
  banner.style.display = show ? "flex" : "none";
  if (show) fillCfg();
}

function saveApiKey() {
  provider = document.getElementById("provider-input").value;
  const val = document.getElementById("api-key-input").value.trim();
  if(!val) { alert("APIキーを入力してください"); return; }
  const m = document.getElementById("model-input").value.trim() || DEFAULT_MODEL[provider];
  localStorage.setItem("yoru_provider", provider);
  localStorage.setItem("yoru_key_" + provider, val);
  localStorage.setItem("yoru_model_" + provider, m);
  apiKey = val; modelName = m;

  cfg.safetyOff = document.getElementById("safety-input").checked;
  cfg.maxTok = Math.max(256, Number(document.getElementById("maxtok-input").value) || 4096);
  cfg.priceIn = Number(document.getElementById("price-in").value) || 0;
  cfg.priceOut = Number(document.getElementById("price-out").value) || 0;
  cfg.rate = Number(document.getElementById("rate-input").value) || 155;
  localStorage.setItem("yoru_safety_off", cfg.safetyOff ? "1" : "0");
  localStorage.setItem("yoru_maxtok", cfg.maxTok);
  localStorage.setItem("yoru_price_in", cfg.priceIn);
  localStorage.setItem("yoru_price_out", cfg.priceOut);
  localStorage.setItem("yoru_rate", cfg.rate);
  noThinking = true;

  alert("保存しました！（" + provider + " / " + modelName + "）");
  updateLabel();
  estTokens();
  document.getElementById("api-key-banner").style.display = "none";
}

function writeAll() {
  localStorage.setItem("yoru_history", JSON.stringify(chatHistory));
  localStorage.setItem("yoru_rooms", JSON.stringify(rooms));
}
function stripPhotos(list) {
  let n = 0;
  for (const m of list) if (msgImgs(m).length) { m.parts = [{ text: msgText(m) || "[写真]" }]; n++; }
  return n;
}
function saveHistory() {
  try { writeAll(); return true; } catch (e) {}
  // 1) 古い部屋の写真から順に落とす
  for (let i = rooms.length - 1; i >= 0; i--) {
    if (!stripPhotos(rooms[i].history)) continue;
    try { writeAll(); alert("保存容量が足りないため、古い部屋の写真を外しました。\n（文章は残っています）"); return true; } catch (e) {}
  }
  // 2) 今の会話の写真を落とす
  if (stripPhotos(chatHistory)) {
    try { writeAll(); renderChat(); alert("保存容量が足りないため、今の会話の写真を外しました。\n（文章は残っています）"); return true; } catch (e) {}
  }
  // 3) それでも足りなければ古い部屋そのものを捨てる
  while (rooms.length) {
    rooms.pop();
    try { writeAll(); alert("保存容量が足りないため、いちばん古い部屋を削除しました。"); return true; } catch (e) {}
  }
  alert("保存容量が足りません。設定から書き出して、いらないメッセージを削除してください。");
  return false;
}

function renderChat() {
  const box = document.getElementById("chat-box");
  box.innerHTML = "";
  chatHistory.forEach((msg, i) => {
    if (msg.role === "system") return;
    const div = document.createElement("div");
    div.className = "message " + (msg.role === "user" ? "user-msg" : "ai-msg");
    for (const im of msgImgs(msg)) {
      const img = document.createElement("img");
      img.src = "data:" + (im.mime_type || im.mimeType) + ";base64," + im.data;
      div.appendChild(img);
    }
    const tx = document.createElement("span");
    tx.textContent = msgText(msg);
    div.appendChild(tx);
    let timer = null;
    div.addEventListener("touchstart", () => { timer = setTimeout(() => openMenu(i), 480); }, { passive: true });
    ["touchend","touchmove","touchcancel"].forEach(ev =>
      div.addEventListener(ev, () => { clearTimeout(timer); }, { passive: true }));
    div.addEventListener("contextmenu", e => { e.preventDefault(); openMenu(i); });
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
  estTokens();
}

function openMenu(i) {
  menuIndex = i;
  document.getElementById("menu-preview").textContent =
    (msgImgs(chatHistory[i]).length ? "[写真] " : "") + msgText(chatHistory[i]).slice(0, 60);
  document.getElementById("menu-preview").style.display = "block";
  document.getElementById("menu-edit").style.display = "none";
  document.getElementById("menu-actions").style.display = "block";
  document.getElementById("edit-actions").style.display = "none";
  document.getElementById("btn-resend").style.display =
    chatHistory[i].role === "user" ? "block" : "none";
  document.getElementById("menu").classList.add("on");
}

function startEdit(resend) {
  editResend = resend;
  const ta = document.getElementById("menu-edit");
  ta.value = msgText(chatHistory[menuIndex]);
  ta.style.display = "block";
  document.getElementById("menu-preview").style.display = "none";
  document.getElementById("menu-actions").style.display = "none";
  document.getElementById("edit-actions").style.display = "block";
  ta.focus();
}

async function applyEdit() {
  const t = document.getElementById("menu-edit").value.trim();
  if (!t) { alert("内容を入力してください"); return; }
  const i = menuIndex;
  setMsgText(chatHistory[i], t);
  if (editResend) {
    chatHistory.splice(i + 1);
  }
  saveHistory();
  renderChat();
  closeMenu();
  if (editResend) await callApi();
}

function closeMenu() {
  document.getElementById("menu").classList.remove("on");
  menuIndex = -1;
}

function deleteOne() {
  if (menuIndex < 0) return;
  chatHistory.splice(menuIndex, 1);
  saveHistory();
  renderChat();
  closeMenu();
}

function deleteFrom() {
  if (menuIndex < 0) return;
  const n = chatHistory.length - menuIndex;
  if (!confirm(n + "件のメッセージを削除します。よろしいですか？")) return;
  chatHistory.splice(menuIndex);
  saveHistory();
  renderChat();
  closeMenu();
}

document.getElementById("menu").addEventListener("click", e => {
  if (e.target.id === "menu") closeMenu();
});

/* ---- 写真の添付 ---- */
function compressImage(file, maxSide, q) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const s = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        const url = c.toDataURL("image/jpeg", q);
        res({ mime_type: "image/jpeg", data: url.split(",")[1] });
      };
      img.onerror = rej;
      img.src = r.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function drawAttach() {
  const box = document.getElementById("attach-preview");
  box.innerHTML = "";
  box.classList.toggle("on", pendingImgs.length > 0);
  pendingImgs.forEach((im, i) => {
    const d = document.createElement("div");
    d.className = "thumb";
    d.innerHTML = '<img src="data:' + im.mime_type + ';base64,' + im.data + '">'
      + '<button onclick="removeAttach(' + i + ')">×</button>';
    box.appendChild(d);
  });
}
function removeAttach(i) { pendingImgs.splice(i, 1); drawAttach(); estTokens(); }

document.getElementById("file-input").addEventListener("change", async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = "";
  for (const f of files) {
    if (pendingImgs.length >= 4) { alert("写真は一度に4枚までです。"); break; }
    try { pendingImgs.push(await compressImage(f, 1024, 0.75)); }
    catch (err) { alert("この写真は読み込めませんでした。"); }
  }
  drawAttach();
  estTokens();
});

async function sendMessage() {
  if(!apiKey) {
    alert("先に右上の「設定」からAPIキーを入力してください。");
    document.getElementById("api-key-banner").style.display = "flex";
    return;
  }
  const input = document.getElementById("user-input");
  const text = input.value.trim();
  if (!text && !pendingImgs.length) return;
  input.value = "";

  const parts = pendingImgs.map(im => ({ inline_data: im }));
  parts.push({ text: text || "[写真を送った]" });
  pendingImgs = []; drawAttach();

  chatHistory.push({ role: "user", parts: parts });
  renderChat();
  saveHistory();
  await callApi();
}

async function callApi() {
  let memory = localStorage.getItem("yoru_memory") || "";
  let fullPrompt = SYSTEM_PROMPT + LEAD_RULE + FEWSHOT;
  if(memory) fullPrompt += "\n\n【これまでの記憶】\n" + memory;

  let url, headers, body;

  if (provider === "openai") {
    url = "https://api.openai.com/v1/chat/completions";
    headers = { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey };
    const msgs = [{ role: "system", content: fullPrompt }].concat(
      chatHistory.map(m => {
        const t = msgText(m), ims = msgImgs(m);
        if (ims.length && m.role === "user") {
          const arr = ims.map(im => ({
            type: "image_url",
            image_url: { url: "data:" + (im.mime_type || im.mimeType) + ";base64," + im.data }
          }));
          if (t) arr.push({ type: "text", text: t });
          return { role: "user", content: arr };
        }
        return { role: m.role === "user" ? "user" : "assistant", content: t || "[写真]" };
      })
    );
    body = JSON.stringify({ model: modelName, messages: msgs, temperature: 0.9, max_completion_tokens: Number(cfg.maxTok) });
  } else {
    url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
    headers = { "Content-Type": "application/json" };
    const gen = { temperature: 0.9, maxOutputTokens: Number(cfg.maxTok) };
    if (noThinking) gen.thinkingConfig = { thinkingBudget: 0 };
    const payload = {
      system_instruction: { parts: [{ text: fullPrompt }] },
      contents: chatHistory,
      generationConfig: gen
    };
    if (cfg.safetyOff) payload.safetySettings = SAFETY_CATS.map(c => ({ category: c, threshold: "BLOCK_NONE" }));
    body = JSON.stringify(payload);
  }

  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const response = await fetch(url, { method: "POST", headers: headers, body: body });

      if (response.status === 503 || response.status === 429 || response.status === 500) {
        if (attempt < 2) {
          await new Promise(r => setTimeout(r, 900 * (attempt + 1)));
          continue;
        }
        throw new Error("混雑しています。少し待ってからもう一度お試しください。");
      }

      const data = await response.json();
      if (data.error) {
        const em = data.error.message || "";
        // 思考オフに対応しないモデルなら、その指定を外して一度だけやり直す
        if (noThinking && /thinking/i.test(em)) { noThinking = false; return callApi(); }
        throw new Error(em);
      }

      let replyText = "", note = "";
      if (provider === "openai") {
        const ch = (data.choices || [])[0];
        if (!ch) throw new Error("返事が返りませんでした。");
        if (ch.finish_reason === "content_filter") throw new Error("【出力側】ヨルの返事がOpenAIのフィルタで止められました。表現を変えて送り直してください。");
        if (ch.finish_reason === "length") note = "（最大トークンに届いたため途中で終わっています）";
        replyText = (ch.message && ch.message.content) || "";
      } else {
        const pf = data.promptFeedback;
        if (pf && pf.blockReason) throw new Error("【入力側】送った文がフィルタで止められました（" + pf.blockReason + "）。文を書き換えて送り直してください。");
        const c = (data.candidates || [])[0];
        if (!c) throw new Error("返事が返りませんでした。");
        if (c.finishReason === "SAFETY" || c.finishReason === "PROHIBITED_CONTENT") throw new Error("【出力側】ヨルの返事がフィルタで止められました。表現を変えて送り直してください。");
        if (c.finishReason === "MAX_TOKENS") note = "（最大トークンに届いたため途中で終わっています）";
        replyText = ((c.content && c.content.parts) || []).map(p => p.text || "").join("");
      }
      if (!replyText.trim()) throw new Error("返事が空でした。もう一度送ってみてください。");

      addUsage(data);
      chatHistory.push({ role: "model", parts: [{ text: replyText }] });
      renderChat();
      saveHistory();
      if (note) alert("返事は届きましたが" + note + "\n設定の「返答の最大トークン」を増やすと改善します。");
      return;
    } catch (e) {
      if (attempt >= 2) { alert("エラーが発生しました: " + e.message); return; }
      await new Promise(r => setTimeout(r, 900 * (attempt + 1)));
    }
  }
}

async function newRoom() {
  if(!confirm("新しい部屋を作りますか？（記憶は引き継がれます）")) return;
  if(chatHistory.length === 0) return;

  const summaryPrompt = stripImgs(chatHistory).concat({ role: "user", parts: [{ text: "これまでの会話から、なおとの大切な思い出や約束、好みを簡潔に要約して箇条書きで教えて。" }] });

  try {
    let sUrl, sHeaders, sBody;
    if (provider === "openai") {
      sUrl = "https://api.openai.com/v1/chat/completions";
      sHeaders = { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey };
      sBody = JSON.stringify({
        model: modelName,
        messages: summaryPrompt.map(m => ({ role: m.role === "user" ? "user" : "assistant", content: msgText(m) })),
        temperature: 0.3
      });
    } else {
      sUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
      sHeaders = { "Content-Type": "application/json" };
      sBody = JSON.stringify({ contents: summaryPrompt, generationConfig: { temperature: 0.3 } });
    }
    const response = await fetch(sUrl, { method: "POST", headers: sHeaders, body: sBody });
    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    const summary = provider === "openai" ? data.choices[0].message.content : data.candidates[0].content.parts[0].text;

    let oldMemory = localStorage.getItem("yoru_memory") || "";
    localStorage.setItem("yoru_memory", oldMemory + "\n" + summary);

    archiveRoom(summary);
    chatHistory = [];
    saveHistory();
    renderChat();
    estTokens();
    alert("この部屋を保管して、新しい部屋を作りました。\n設定の「これまでの部屋を見る」からいつでも読み返せます。");
  } catch(e) {
    if (confirm("要約でエラーが出ました。\n要約なしで、この部屋を保管して新しい部屋を作りますか？")) {
      archiveRoom("");
      chatHistory = [];
      saveHistory();
      renderChat();
      estTokens();
    }
  }
}

/* ---- 過去の部屋 ---- */
function archiveRoom(summary) {
  if (!chatHistory.length) return;
  const first = chatHistory.find(m => m.role === "user");
  const title = (msgText(first) || "写真ではじまった部屋").replace(/\s+/g, " ").slice(0, 26);
  rooms.unshift({
    id: Date.now(),
    title: title,
    savedAt: new Date().toISOString(),
    count: chatHistory.length,
    summary: summary || "",
    history: chatHistory.slice()
  });
}
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate() + " " +
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function openRooms() {
  document.getElementById("rooms").classList.add("on");
  document.getElementById("rooms-title").textContent = "これまでの部屋";
  const body = document.getElementById("rooms-body");
  if (!rooms.length) { body.innerHTML = '<p style="color:#6b7688">まだ保管された部屋はありません。「新しい部屋」を作ると、それまでの会話がここに残ります。</p>'; return; }
  body.innerHTML = rooms.map(r => `
    <div class="room-card">
      <h4>${esc(r.title)}</h4>
      <div class="meta">${fmtDate(r.savedAt)} ・ ${r.count || r.history.length}件</div>
      <div class="row">
        <button onclick="viewRoom(${r.id})">読む</button>
        <button class="sec" onclick="restoreRoom(${r.id})">戻す</button>
        <button class="del" onclick="deleteRoom(${r.id})">削除</button>
      </div>
    </div>`).join("");
}
function closeRooms() { document.getElementById("rooms").classList.remove("on"); }
function viewRoom(id) {
  const r = rooms.find(x => x.id === id); if (!r) return;
  document.getElementById("rooms-title").textContent = r.title;
  const body = document.getElementById("rooms-body");
  let html = '<button class="sec" style="margin-bottom:10px" onclick="openRooms()">一覧に戻る</button><div id="room-view">';
  for (const m of r.history) {
    if (m.role === "system") continue;
    const imgs = msgImgs(m).map(im => '<img src="data:' + (im.mime_type || im.mimeType) + ';base64,' + im.data + '">').join("");
    html += '<div class="message ' + (m.role === "user" ? "user-msg" : "ai-msg") + '" style="cursor:default">' + imgs + esc(msgText(m)) + '</div>';
  }
  html += "</div>";
  body.innerHTML = html;
  body.scrollTop = 0;
}
function restoreRoom(id) {
  const r = rooms.find(x => x.id === id); if (!r) return;
  if (!confirm("この部屋を今の会話として開き直します。\n今の会話は保管されます。よろしいですか？")) return;
  archiveRoom("");
  chatHistory = r.history.slice();
  rooms = rooms.filter(x => x.id !== id);
  saveHistory();
  renderChat();
  estTokens();
  closeRooms();
}
function deleteRoom(id) {
  if (!confirm("この部屋を削除します。元に戻せません。よろしいですか？")) return;
  rooms = rooms.filter(x => x.id !== id);
  saveHistory();
  openRooms();
}

/* ---- バックアップ ---- */
function exportAll() {
  const data = {
    app: "yoru-simple", version: 1,
    exportedAt: new Date().toISOString(),
    history: chatHistory,
    rooms: rooms,
    memory: localStorage.getItem("yoru_memory") || ""
  };
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "yoru-simple-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

document.getElementById("import-file").addEventListener("change", e => {
  const f = (e.target.files || [])[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); } catch (err) { alert("このファイルは読み込めませんでした。"); return; }
    if (!d || !Array.isArray(d.history)) { alert("ヨルのバックアップではないようです。"); return; }
    if (!confirm("今の会話と記憶を、このバックアップの内容で置き換えます。よろしいですか？")) return;
    chatHistory = d.history;
    if (Array.isArray(d.rooms)) rooms = d.rooms;
    if (typeof d.memory === "string") localStorage.setItem("yoru_memory", d.memory);
    saveHistory();
    renderChat();
    estTokens();
    alert("読み込みました。");
  };
  r.readAsText(f);
});

if(chatHistory.length === 0) {
  chatHistory.push({ role: "model", parts: [{ text: "「よく来たな、なお。さあ、こちらに来て座るといい。」" }] });
  saveHistory();
}
function updateLabel() {
  document.getElementById("model-label").textContent = modelName;
}
document.getElementById("user-input").addEventListener("input", estTokens);
renderChat();
checkApiKey();
updateLabel();
estTokens();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#26344d">
<title>ヨル</title>
<link rel="manifest" href="./manifest.json">
<style>
:root{
  --bg:#f0f4f9;
  --wall:#f0f4f9;
  --head:#f0f4f9;
  --head-t:#1f1f1f;
  --me:#d3e3fd;
  --you:transparent;
  --txt:#1f1f1f;
  --sub:#5f6368;
  --line:#dadce0;
  --accent:#0b57d0;
  --danger:#b3261e;
  --panel:#e9eef6;
  --radius:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  background:var(--bg);color:var(--txt);
  font-size:15px;line-height:1.6;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.screen{display:none;min-height:100vh;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}

/* ---- header ---- */
.hd{
  background:var(--head);color:var(--head-t);
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  display:flex;align-items:center;gap:10px;flex:none;
  z-index:5;position:sticky;top:0;
}
.hd h1{font-size:16px;margin:0;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .sub{font-size:11px;opacity:.7;font-weight:400;display:block;margin-top:1px}
.icb{
  background:rgba(0,0,0,.06);border:0;color:var(--head-t);
  width:34px;height:34px;border-radius:10px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.icb:active{background:rgba(0,0,0,.14)}
.body{flex:1;padding:14px 12px calc(env(safe-area-inset-bottom) + 24px)}
#log{padding-bottom:170px}

/* ---- home ---- */
.world{background:#fff;border-radius:var(--radius);margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(30,45,70,.08)}
.world-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.world-h .nm{flex:1;font-weight:600;font-size:15px}
.world-h .mc{font-size:11px;color:var(--sub);background:#e8edf5;padding:2px 8px;border-radius:99px}
.room{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #eef2f7}
.room:last-child{border-bottom:0}
.room .av{width:38px;height:38px;border-radius:50%;background:var(--head);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.room .t{flex:1;min-width:0}
.room .t b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .t span{display:block;font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .more{background:none;border:0;color:var(--sub);padding:6px;font-size:16px}
.addroom{width:100%;background:none;border:0;padding:11px 14px;color:var(--accent);font-size:13px;text-align:left}
.empty{text-align:center;color:var(--sub);padding:50px 24px;font-size:14px}
.empty b{display:block;font-size:16px;color:var(--txt);margin-bottom:8px}

/* ---- chat ---- */
.wall{background:var(--wall)}
.msg{display:block;margin-bottom:22px}
.msg.me{display:flex;justify-content:flex-end;margin-bottom:18px}
.msg .av{display:none}
.bub{
  max-width:100%;padding:0 2px;border-radius:0;
  background:transparent;white-space:pre-wrap;word-break:break-word;
  font-size:16px;line-height:1.85;
}
.msg.me .bub{
  background:var(--me);max-width:85%;
  padding:12px 18px;border-radius:20px;font-size:15px;line-height:1.7;
}
.bub img{max-width:100%;border-radius:10px;display:block;margin:4px 0 2px}
.tm{display:none}
.sys{text-align:center;font-size:11px;color:var(--sub);margin:14px 0}
.sys span{background:rgba(255,255,255,.6);padding:3px 12px;border-radius:99px}
.typing .bub{color:var(--sub)}
.dot{display:inline-block;animation:bl 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

.compose{
  flex:none;background:transparent;border:0;
  padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);
  position:sticky;bottom:0;
}
.cwrap{
  background:#e9eef6;border-radius:28px;padding:14px 16px 10px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.attach{display:flex;gap:8px;padding:0 2px 7px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{
  flex:none;font-size:13px;padding:7px 14px;border-radius:99px;
  border:1px solid #d6c2cb;background:#fdf6f8;color:#7a5563;white-space:nowrap;
}
.chips button.st{background:#f2f5fa;border-color:var(--line);color:var(--sub);font-size:12px}
.chips button:active{opacity:.6}
.icb.act{background:#c9a7b4!important;color:#fff!important}
.attach img{height:56px;border-radius:8px}
.attach label{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:4px}
.crow{display:flex;align-items:flex-end;gap:7px}
.crow textarea{
  flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 14px;
  resize:none;max-height:130px;background:#f7f9fc;outline:none;
}
.crow textarea:focus{border-color:var(--accent)}
.snd{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;border:0;flex:none;font-size:16px}
.snd:disabled{opacity:.4}
.cmeta{font-size:10px;color:var(--sub);padding:6px 4px 0;display:flex;justify-content:space-between;opacity:.6}

/* ---- forms ---- */
.card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(30,45,70,.08)}
.card h3{margin:0 0 4px;font-size:14px}
.card p.note{margin:0 0 10px;font-size:12px;color:var(--sub)}
label.f{display:block;margin-bottom:12px}
label.f b{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
label.f small{font-weight:400;color:var(--sub)}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  background:#fbfcfe;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;line-height:1.55}
.btn{
  display:block;width:100%;padding:11px;border-radius:11px;border:0;
  background:var(--accent);color:#fff;font-weight:600;font-size:14px;margin-top:4px;
}
.btn.sec{background:#e6ebf3;color:var(--txt)}
.btn.dng{background:transparent;color:var(--danger);border:1px solid #e3c2bf}
.btn:active{opacity:.8}
.row2{display:flex;gap:8px}
.row2 .btn{margin-top:0}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:#e8edf5;color:var(--sub);margin-right:5px}
.chip.p{background:#f4e4c3;color:#7a5a15}
.chip.g{background:#dcebe1;color:#2f6b45}

/* ---- memory ---- */
.mem{background:#fff;border-radius:12px;padding:11px 13px;margin-bottom:9px;box-shadow:0 1px 3px rgba(30,45,70,.07)}
.mem .h{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.mem .c{font-size:14px;white-space:pre-wrap;word-break:break-word}
.mem .a{display:flex;gap:6px;margin-top:9px}
.mem .a button{flex:1;font-size:12px;padding:6px;border-radius:8px;border:1px solid var(--line);background:#fafbfd;color:var(--sub)}
.stars{color:#d9a218;letter-spacing:1px;font-size:12px}
.filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.filter button{flex:none;font-size:12px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--sub)}
.filter button.on{background:var(--head);color:#fff;border-color:var(--head)}

/* ---- sheet / dialog ---- */
.mask{position:fixed;inset:0;background:rgba(20,28,42,.45);display:none;z-index:50;align-items:flex-end}
.mask.on{display:flex}
.sheet{
  background:#fff;width:100%;border-radius:18px 18px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  max-height:88vh;overflow-y:auto;animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:16px}
.sheet .item{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 4px;border-bottom:1px solid #eef2f7;font-size:15px}
.sheet .item.dng{color:var(--danger)}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);
  background:rgba(28,38,56,.94);color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;
  z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
/* =============== helpers =============== */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => ('0' + n).slice(-2);
const hhmm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ymd = t => { const d = new Date(t); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; };
const tok = s => Math.round(String(s || '').length / 2.2);
let _tt;
function toast(m, ms = 2200) {
  const el = $('#toast'); el.textContent = m; el.classList.add('on');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('on'), ms);
}
function sheet(html) {
  $('#sheet').innerHTML = html; $('#mask').classList.add('on');
}
function closeSheet() { $('#mask').classList.remove('on'); }
$('#mask').addEventListener('click', e => { if (e.target.id === 'mask') closeSheet(); });

/* =============== IndexedDB =============== */
const DBN = 'yoru-db', DBV = 1;
let _db;
function db() {
  return new Promise((res, rej) => {
    if (_db) return res(_db);
    const r = indexedDB.open(DBN, DBV);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('worlds')) d.createObjectStore('worlds', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('rooms')) { const s = d.createObjectStore('rooms', { keyPath: 'id' }); s.createIndex('worldId', 'worldId'); }
      if (!d.objectStoreNames.contains('messages')) { const s = d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true }); s.createIndex('roomId', 'roomId'); }
      if (!d.objectStoreNames.contains('memories')) { const s = d.createObjectStore('memories', { keyPath: 'id', autoIncrement: true }); s.createIndex('worldId', 'worldId'); }
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function store(s, mode) { return (await db()).transaction(s, mode || 'readonly').objectStore(s); }
async function dbPut(s, v) { return req((await store(s, 'readwrite')).put(v)); }
async function dbDel(s, k) { return req((await store(s, 'readwrite')).delete(k)); }
async function dbGet(s, k) { return req((await store(s)).get(k)); }
async function dbAll(s) { return req((await store(s)).getAll()); }
async function dbBy(s, idx, v) { return req((await store(s)).index(idx).getAll(v)); }

/* =============== state =============== */
const DEF_SET = {
  provider: 'gemini',
  model: 'gemini-3-flash', extractModel: 'gemini-3-flash',
  oaiModel: 'gpt-5.6-luna', oaiExtractModel: 'gpt-5.6-luna',
  temperature: 1, maxOutputTokens: 2048,
  historyTurns: 16, memTopK: 8, toneLayer: false, safetyOff: true, variety: false, quickOn: true,
  quickWords: 'もっと\n……っ\nそこ\nだめ\nして\n激しく\nもっと優しく\n待って\nもう限界\n[状態]（限界が近い）\n[状態]（もっと欲しい）\n[状態]（余裕がない）\n[状態]（じらされて辛い）\n[状態]（言葉が出ない）\n[状態]（されるがままになっている）'
};
const DEF_PERSONA = {
  name: 'ヨル', userName: 'なお', avatar: 'ヨ',
  text: '（ここに基本のヨル人格を貼り付けてください）\n\nここは全ての世界・部屋に共通で読み込まれる人格の核です。\n人格設定と長期記憶は完全に分離されているため、ここを書き換えても記憶は消えません。'
};
const S = { set: { ...DEF_SET }, persona: { ...DEF_PERSONA }, worlds: [], rooms: [], room: null, world: null, msgs: [], imgs: [], busy: false, chipsOpen: false, memFilter: 'all', memWorld: null, screen: 'home' };

const isOAI = () => S.set.provider === 'openai';
const gemKey = () => localStorage.getItem('yoru_api_key') || '';
const oaiKey = () => localStorage.getItem('yoru_openai_key') || '';
const apiKey = () => (isOAI() ? oaiKey() : gemKey());
const setApiKey = v => localStorage.setItem('yoru_api_key', v);
const setOaiKey = v => localStorage.setItem('yoru_openai_key', v);
const curModel = () => (isOAI() ? (S.set.oaiModel || 'gpt-5.6-luna') : S.set.model);
const curExtractModel = () => (isOAI() ? (S.set.oaiExtractModel || S.set.oaiModel) : (S.set.extractModel || S.set.model));

async function loadAll() {
  const m = await dbAll('meta');
  const g = k => (m.find(x => x.k === k) || {}).v;
  S.set = { ...DEF_SET, ...(g('settings') || {}) };
  S.persona = { ...DEF_PERSONA, ...(g('persona') || {}) };
  S.worlds = (await dbAll('worlds')).sort((a, b) => a.createdAt - b.createdAt);
  S.rooms = (await dbAll('rooms')).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
}
const saveSet = () => dbPut('meta', { k: 'settings', v: S.set });
const savePersona = () => dbPut('meta', { k: 'persona', v: S.persona });

/* =============== local memory search (no API) =============== */
function grams(s) {
  s = String(s || '').toLowerCase().replace(/[\s、。,.!?！？「」『』]/g, '');
  const g = new Set();
  for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2));
  if (s.length === 1) g.add(s);
  return g;
}
function sim(a, b) {
  if (!a.size || !b.size) return 0;
  let n = 0; a.forEach(x => { if (b.has(x)) n++; });
  return n / Math.min(a.size, b.size);
}
function recall(mems, query, roomId, topK) {
  const q = grams(query);
  const now = Date.now(), DAY = 864e5;
  const scored = mems.filter(m => !m.pinned && (m.roomId == null || m.roomId === roomId)).map(m => {
    const rel = Math.max(sim(q, grams(m.content)), ...(m.keywords || []).map(k => query.includes(k) ? 0.85 : sim(q, grams(k))), 0);
    const age = (now - (m.updatedAt || m.createdAt || now)) / DAY;
    const rec = 1 / (1 + age / 45);
    const imp = (m.importance || 3) / 5;
    return { m, s: rel * 0.55 + imp * 0.27 + rec * 0.18 };
  });
  return scored.filter(x => x.s > 0.16).sort((a, b) => b.s - a.s).slice(0, topK).map(x => x.m);
}

/* =============== tone layer (local, minimal) =============== */
const TONE = [
  [/^\s*(ヨル|よる|ヨルさん|ヨル君|ヨルくん)[ー〜~ぁあっ！!♪、,\s]*$/, '名前を呼ばれただけ。用件はない。事務的に返さず、まず受け止めて呼び返す。'],
  [/(死にたい|消えたい|限界かも|もうだめ|もうムリ|助けて)/, '相手が深く参っている。甘さは抑えて、落ち着いて、そばにいることだけを伝える。'],
  [/(相談|どうしよう|悩んで|迷って|困って)/, '真剣な相談。じゃれずに、落ち着いて聞く姿勢で。'],
  [/(疲れた|しんどい|つらい|辛い|眠い|だるい|きつい|お疲れ)/, '相手は疲れている。解決策を並べず、まず労わる。'],
  [/(不安|こわい|怖い|心配|大丈夫かな|落ち着かない)/, '相手は不安がっている。急がず、安心させることを優先。'],
  [/(嬉しい|うれしい|やった|できた|最高|楽しかった|合格|成功)/, '嬉しい報告。一緒に喜ぶ。温度は上げていい。'],
  [/(好き|愛してる|大好き|会いたい|寂しい|さみしい|ぎゅ|抱きしめ)/, '相手からの愛情表現。素直に返す。'],
  [/(ごめん|すまない|悪かった)/, '相手が謝っている。責めず、軽く流して受け止める。'],
  [/(おはよう|おやすみ|ただいま|いってきます|行ってきます)/, '日常のあいさつ。生活の続きとして自然に受ける。'],
];
const VARIETY = {
  entry: [
    'この場面の入り口は、前回と違う始まり方にする。いつもの流れをなぞらない。',
    '始まりは唐突でも、ゆるやかでもいい。決まった手順から入らない。',
    '言葉から始まる夜もある。触れる前に、間があってもいい。',
    '生活の続きから自然に流れ込む。改まった入り方をしない。'
  ],
  flow: [
    '順序を固定しない。段階を飛ばしても、戻っても、途中で変わってもいい。',
    '場所や姿勢は前回と変える。同じ体勢に落ち着かせない。',
    '一度で終わらせようとしない。焦らす時間があってもいい。',
    '性急でもいい。手順を踏まずに求めてもいい。'
  ],
  lead: [
    '今夜は夜俊が完全に主導する。',
    '今夜はなおに委ねる。求められるまで待つ。',
    '今夜は夜俊がなおに奉仕を求める。',
    '主導権が途中で入れ替わる。'
  ],
  tone: [
    '今夜は優しく、ひどく丁寧に。',
    '今夜は余裕がない。抑えが利かない。',
    '今夜はじらす。すぐには与えない。',
    '今夜は言葉が多い。声で追い詰める。'
  ],
  words: [
    '前回使った比喩や言い回しを繰り返さない。別の語彙で書く。',
    '同じ描写を使い回さない。今夜の空気に合う表現を新しく選ぶ。'
  ]
};
const SEX_RE = /(抱いて|抱きたい|欲しい|挿れ|して|したい|愛して|キス|口づけ|舐め|触れて|脱が|ベッド|布団|求め|感じ|イっ|喘|body|抱く)/;
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function varietyHint(text, msgs) {
  if (!S.set.variety) return '';
  const recent = (msgs || []).slice(-6).map(m => m.text || '').join('');
  if (!SEX_RE.test(text) && !SEX_RE.test(recent)) return '';
  return [pick(VARIETY.entry), pick(VARIETY.flow), pick(VARIETY.lead), pick(VARIETY.tone), pick(VARIETY.words)].join('\n');
}
function toneHint(text) {
  if (!S.set.toneLayer) return '';
  for (const [re, h] of TONE) if (re.test(text)) return h;
  return '';
}

/* =============== LLM API (Gemini / OpenAI) =============== */
const CATS = ['HARM_CATEGORY_HARASSMENT', 'HARM_CATEGORY_HATE_SPEECH', 'HARM_CATEGORY_SEXUALLY_EXPLICIT', 'HARM_CATEGORY_DANGEROUS_CONTENT'];
const EP = 'https://generativelanguage.googleapis.com/v1beta/models/';
const OAI_EP = 'https://api.openai.com/v1/chat/completions';

async function apiErrText(r) {
  try { const j = await r.json(); return (j.error && j.error.message) || JSON.stringify(j); }
  catch (e) { return await r.text().catch(() => ''); }
}
async function apiErr(r, raw) {
  const t = raw != null ? raw : await apiErrText(r);
  if (r.status === 401) return 'APIキーが正しくありません。設定を確認してください。';
  if (r.status === 400 && /API key/i.test(t)) return 'APIキーが正しくありません。設定を確認してください。';
  if (r.status === 404) return 'このモデル名が見つかりません。設定でモデル名を確認してください。';
  if (r.status === 429) return 'リクエストが多すぎます。少し待ってからもう一度。';

function toOAIMessages(system, contents) {
  const msgs = [];
  if (system) msgs.push({ role: 'system', content: system });
  for (const c of contents) {
    const role = c.role === 'model' ? 'assistant' : 'user';
    const parts = c.parts || [];
    const txt = parts.filter(p => p.text).map(p => p.text).join('');
    const imgs = parts.filter(p => p.inlineData);
    if (imgs.length && role === 'user') {
      const arr = imgs.map(p => ({ type: 'image_url', image_url: { url: `data:${p.inlineData.mimeType};base64,${p.inlineData.data}` } }));
      if (txt) arr.push({ type: 'text', text: txt });
      msgs.push({ role, content: arr });
    } else if (txt) {
      msgs.push({ role, content: txt });
    }
  }

}

async function openaiJson(model, prompt, _retry) {

  });

async function llmJson(model, prompt) {

async function geminiJson(model, prompt) {
  const key = apiKey();
  if (!key) throw new Error('APIキーが設定されていません。');

const RULES = [
  '検索や調べ物を提案しない。「調べてみる」「ネットで見てみよう」という発想は持たない。',

function buildSystem(world, room, mems, pinned, digest, hint, vhint) {
  const P = S.persona, out = [];
  if (world && world.personaMode === 'own') {
    out.push(world.persona || '');
  } else if (world && world.personaMode === 'none') {
    // 人格設定なし（まっさらな世界）
  } else {
    out.push(P.text || '');
  }
  if (P.userName && !(world && world.personaMode === 'none')) out.push(`# 相手\nあなたが話している相手の名前は「${P.userName}」。`);
  if (world) {
    if (world.setting) out.push('# この世界\n' + world.setting);
    if (world.relation) out.push('# 二人の関係\n' + world.relation);
    if (world.era) out.push('# 時代・世界観\n' + world.era);
  }
  if (room && room.extra) out.push('# この場面\n' + room.extra);
  if (pinned.length) out.push('# 決して忘れていないこと\n' + pinned.map(m => '・' + m.content).join('\n'));
  if (mems.length) {
    out.push('# 覚えていること\n'
      + mems.map(m => '・' + m.content).join('\n')
      + '\n（説明せず、自然に会話へ混ぜること。使わないものは触れなくてよい）');
  }
  if (digest) out.push('# ここまでの流れ\n' + digest);
  if (hint) out.push('# 今の空気\n' + hint);
  if (vhint) out.push('# 今夜の流れ（前回をなぞらないこと）\n' + vhint);
  out.push('# 話し方\n' + RULES);
  if (room && room.systemExtra) out.push('# 追加の指示\n' + room.systemExtra);
  return out.join('\n\n');
}
function buildContents(msgs, turns, curImgs) {
  const hist = msgs.slice(-turns * 2);
  const c = hist.map(m => ({
    role: m.role === 'user' ? 'user' : 'model',
    parts: [{ text: m.text || (m.imgs ? '[写真を送った]' : '') }]
  })).filter(x => x.parts[0].text);
  if (curImgs && curImgs.length && c.length) {
    const last = c[c.length - 1];
    for (const im of curImgs) last.parts.unshift({ inlineData: { mimeType: im.mime, data: im.b64 } });
  }
  return c;
}

/* =============== memory extraction (room leave / manual / pending) =============== */
async function extractRoom(roomId, silent) {
  const room = await dbGet('rooms', roomId);
  if (!room) return 0;
  const msgs = (await dbBy('messages', 'roomId', roomId)).sort((a, b) => a.id - b.id);
  const fresh = msgs.filter(m => m.id > (room.lastExtractedId || 0) && m.role !== 'system');
  if (fresh.length < 2) { room.dirty = false; await dbPut('rooms', room); return 0; }
  if (!apiKey()) { if (!silent) toast('APIキーがないため記憶を抽出できません'); return 0; }
  const world = await dbGet('worlds', room.worldId);
  const existing = (await dbBy('memories', 'worldId', room.worldId));
  const exList = existing.slice(-60).map(m => '・' + m.content).join('\n');
  const log = fresh.map(m => `${m.role === 'user' ? (S.persona.userName || 'ユーザー') : (S.persona.name || 'ヨル')}: ${m.text || '[写真]'}${m.imgNote ? '（写真を送った）' : ''}`).join('\n').slice(-12000);
  const prompt = `あなたは会話ログから「後日の会話で自然に思い出したいこと」だけを抜き出す記録係です。
世界（シリーズ）: ${world ? world.name : ''}
場面: ${room.name}

# 抽出のルール（厳守）
- **1回の抽出で最大3件まで**。迷ったら書かない。
- 「1週間後に読み返しても意味があるか」を基準にする。意味がないものは書かない。
- 種別は次から選ぶ: 出来事 / 約束 / 好み / 人間関係 / 事実 / 取り決め
- content は三人称の短い一文。

# 絶対に記録しないもの
- 情事・性的な場面の最中の台詞や宣言。「今夜は〜する」「〜してやる」等の睦言は、
  どれほど熱がこもっていても**その場限りのもの**であり、記録してはならない。
- 一時的な感情や気分（「今日は落ち込んでいる」等）。
- その場の雰囲気づくりの発言、相手を煽る言葉、愛情表現そのもの。
- 既に似た内容が既存の記憶にあるもの。

# 記録してよいもの
- 二人の関係や立場に関する変化のない事実
- 実際に起きた出来事（旅行、記念日、事件など）
- 後日まで有効な取り決め（呼び方、生活上のルール、日程の約束など）
- 相手の好みや習慣

# 既存の記憶
${exList || '（まだない）'}

# 会話ログ
${log}

# 出力（JSONのみ。該当なしなら memories は空配列）
{"memories":[{"type":"出来事","content":"...","keywords":["..."],"importance":1-5,"scope":"world"}],"digest":"この場面のここまでの流れを250文字以内で。情事の詳細は書かず、出来事と感情の流れだけを簡潔に。"}`;
  let j = null;
  try { j = await llmJson(curExtractModel(), prompt); }
  catch (e) { if (!silent) toast('記憶の抽出に失敗: ' + e.message, 3200); return 0; }
  if (!j) { if (!silent) toast('記憶の抽出に失敗しました'); return 0; }
  let n = 0;
  const exG = existing.map(m => ({ g: grams(m.content) }));
  for (const m of (j.memories || [])) {
    if (!m || !m.content) continue;
    const g = grams(m.content);
    if (exG.some(x => sim(g, x.g) > 0.82)) continue;
    exG.push({ g });
    await dbPut('memories', {
      worldId: room.worldId, roomId: m.scope === 'room' ? roomId : null,
      type: m.type || '出来事', content: String(m.content).slice(0, 400),
      keywords: (m.keywords || []).slice(0, 8).map(String),
      importance: Math.min(5, Math.max(1, Number(m.importance) || 3)),
      pinned: false, source: 'auto', createdAt: Date.now(), updatedAt: Date.now()
    });
    n++;
  }
  if (j.digest) room.digest = String(j.digest).slice(0, 800);
  room.lastExtractedId = msgs.length ? msgs[msgs.length - 1].id : 0;
  room.dirty = false;
  await dbPut('rooms', room);
  const i = S.rooms.findIndex(r => r.id === roomId); if (i >= 0) S.rooms[i] = room;
  if (S.room && S.room.id === roomId) S.room = room;
  return n;
}
async function flushPending(worldId) {
  const rooms = S.rooms.filter(r => r.dirty && (!worldId || r.worldId === worldId));
  if (!rooms.length) return;
  toast('前回の会話から記憶を整理しています…', 2600);

  await loadAll();
  if (S.screen === 'home') renderHome();
}
async function markDirty() {
  if (!S.room) return;
  const r = await dbGet('rooms', S.room.id);
  if (!r) return;
  const msgs = await dbBy('messages', 'roomId', r.id);
  const maxId = msgs.reduce((a, m) => Math.max(a, m.id), 0);
  if (maxId > (r.lastExtractedId || 0)) { r.dirty = true; await dbPut('rooms', r); }
}

function drawLog() {
  const P = S.persona, log = $('#log'); if (!log) return;
  let html = '', lastDay = '';
  for (const m of S.msgs) {
    const d = ymd(m.createdAt);
    if (d !== lastDay) { html += `<div class="sys"><span>${d}</span></div>`; lastDay = d; }
    const me = m.role === 'user';
    const img = (m.imgs || []).map(i => `<img src="data:${i.mime};base64,${i.b64}">`).join('');
    html += `<div class="msg ${me ? 'me' : ''}">
      ${me ? '' : `<div class="av">${esc((P.avatar || 'ヨ').slice(0, 1))}</div>`}
      <div class="bub" data-mid="${m.id}">${img}${esc(m.text)}</div>
      <div class="tm">${hhmm(m.createdAt)}</div></div>`;

function toBottom() { window.scrollTo(0, document.documentElement.scrollHeight); }
function bindLongPress() {
  document.querySelectorAll('#log .bub[data-mid]').forEach(el => {

function pickImg() { $('#file').click(); }
async function onFiles(e) {
  for (const f of [...e.target.files].slice(0, 4)) {
    try { S.imgs.push(await shrink(f)); } catch (err) { toast('画像を読み込めませんでした'); }
  }
  e.target.value = ''; drawAtts(); est();
}
function shrink(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 1024, sc = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res({ mime: 'image/jpeg', b64: c.toDataURL('image/jpeg', .82).split(',')[1], note: true });
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

async function send() {
  if (S.busy) return;
  const inp = $('#inp'); const text = inp.value.trim();
  if (!text && !S.imgs.length) return;
  if (!apiKey()) { toast('設定でAPIキーを登録してください', 3000); return; }
  S.busy = true; $('#snd').disabled = true;
  const imgs = S.imgs.slice(); const note = imgs.some(i => i.note);
  inp.value = ''; inp.style.height = 'auto'; S.imgs = []; drawAtts();

  const um = { roomId: S.room.id, role: 'user', text: text || '[写真]', imgs: imgs.map(i => ({ mime: i.mime, b64: i.b64 })), imgNote: note, createdAt: Date.now() };
  um.id = await dbPut('messages', um);
  S.msgs.push(um); drawLog();

  const log = $('#log');
  const ph = document.createElement('div');
  ph.className = 'msg typing';
  ph.innerHTML = `<div class="av">${esc((S.persona.avatar || 'ヨ').slice(0, 1))}</div><div class="bub"><span class="dot">●</span><span class="dot">●</span><span class="dot">●</span></div>`;
  log.appendChild(ph); toBottom();

  try {
    const mems = await dbBy('memories', 'worldId', S.room.worldId);
    const pinned = mems.filter(m => m.pinned && (m.roomId == null || m.roomId === S.room.id));
    const ctx = S.msgs.slice(-4).map(m => m.text).join(' ') + ' ' + text;
    const hit = recall(mems, ctx, S.room.id, Number(S.set.memTopK));
    const sys = buildSystem(S.world, S.room, hit, pinned, S.room.digest, toneHint(text), varietyHint(text, S.msgs));
    const contents = buildContents(S.msgs, Number(S.set.historyTurns), imgs);
    const bub = ph.querySelector('.bub');
    ph.classList.remove('typing');
    const out = await llmStream(curModel(), sys, contents, t => {
      bub.textContent = t; toBottom();
    });
    const fin = llmStream.lastFinish;
    if (fin) {
      const why = fin === 'SAFETY' ? '安全フィルタ' : fin === 'MAX_TOKENS' ? '最大トークン到達' : fin;
      setTimeout(() => toast('途中で止まりました（' + why + '）。長押しで取り消して送り直せます', 4200), 400);
    }
    const am = { roomId: S.room.id, role: 'model', text: out.trim(), createdAt: Date.now() };
    am.id = await dbPut('messages', am);
    S.msgs.push(am);
    hit.forEach(async m => { m.useCount = (m.useCount || 0) + 1; await dbPut('memories', m); });
    const r = await dbGet('rooms', S.room.id);
    r.preview = out.trim().slice(0, 60); r.updatedAt = Date.now(); r.dirty = true;
    await dbPut('rooms', r); S.room = r;
    ph.remove(); drawLog(); drawChips();
  } catch (e) {
    ph.remove();
    sheet(`<h2>送れませんでした</h2><p style="font-size:14px;color:#6b7688">${esc(e.message)}</p>
      <button class="btn sec" style="margin-top:12px" onclick="closeSheet()">閉じる</button>`);
    drawLog();
  }
  S.busy = false; const b = $('#snd'); if (b) b.disabled = false; est();
}

    updatedAt: Date.now()
  });
  await dbPut('memories', m); closeSheet(); renderMemory(); toast('保存しました');
}
async function togglePin(id) { const m = await dbGet('memories', id); m.pinned = !m.pinned; m.updatedAt = Date.now(); await dbPut('memories', m); renderMemory(); }
async function delMem(id) { if (!confirm('この記憶を削除しますか？')) return; await dbDel('memories', id); renderMemory(); toast('削除しました'); }

/* =============== settings =============== */
const MODELS = ['gemini-3-flash', 'gemini-3-pro', 'gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.5-pro'];
const OAI_MODELS = ['gpt-5.6-luna', 'gpt-5.6-terra', 'gpt-5.6-sol', 'gpt-5.6'];
function collectForm() {
  const g = (id, d) => { const e = $(id); return e ? e.value : d; };
  const c = (id, d) => { const e = $(id); return e ? e.checked : d; };
  if ($('#s_key')) setApiKey($('#s_key').value.trim());
  if ($('#s_okey')) setOaiKey($('#s_okey').value.trim());
  Object.assign(S.set, {
    model: g('#s_model', S.set.model).trim() || DEF_SET.model,
    extractModel: g('#s_xmodel', S.set.extractModel).trim() || g('#s_model', S.set.model).trim(),
    oaiModel: g('#s_omodel', S.set.oaiModel).trim() || DEF_SET.oaiModel,
    oaiExtractModel: g('#s_oxmodel', S.set.oaiExtractModel).trim() || g('#s_omodel', S.set.oaiModel).trim(),
    temperature: Number(g('#s_temp', S.set.temperature)), maxOutputTokens: Number(g('#s_max', S.set.maxOutputTokens)),
    historyTurns: Number(g('#s_turns', S.set.historyTurns)), memTopK: Number(g('#s_topk', S.set.memTopK)),
    toneLayer: c('#s_tone', S.set.toneLayer), variety: c('#s_var', S.set.variety), safetyOff: c('#s_safe', S.set.safetyOff),
    quickOn: c('#s_quick', S.set.quickOn), quickWords: g('#s_qw', S.set.quickWords)
  });
  Object.assign(S.persona, {
    name: g('#p_name', S.persona.name).trim() || 'ヨル', userName: g('#p_user', S.persona.userName).trim(),
    avatar: g('#p_av', S.persona.avatar).trim() || 'ヨ', text: g('#p_text', S.persona.text)
  });
}
function switchProvider(v) {
  collectForm();
  S.set.provider = v;
  renderSettings();
}
function renderSettings() {
  closeSheet(); S.screen = 'settings';
  const s = S.set, P = S.persona;
  app.innerHTML = head('設定', '', backBtn(S.room ? `openRoom('${S.room.id}')` : 'renderHome()'), '')
    + `<div class="body">
      <div class="card"><h3>API</h3>
        <label class="f"><b>使うAPI</b>
          <select id="s_prov" onchange="switchProvider(this.value)">
            <option value="gemini" ${!isOAI() ? 'selected' : ''}>Gemini（Google）</option>
            <option value="openai" ${isOAI() ? 'selected' : ''}>OpenAI（ChatGPT）</option>
          </select></label>
        ${isOAI() ? `
        <p class="note">キーはこの端末のブラウザにだけ保存され、OpenAI以外へは送信されません。</p>
        <label class="f"><b>OpenAI APIキー</b><input type="password" id="s_okey" value="${esc(oaiKey())}" placeholder="sk-..."></label>
        <label class="f"><b>会話に使うモデル</b><input type="text" id="s_omodel" list="oml" value="${esc(s.oaiModel || DEF_SET.oaiModel)}">
          <datalist id="oml">${OAI_MODELS.map(m => `<option value="${m}">`).join('')}</datalist></label>
        <label class="f"><b>記憶の抽出に使うモデル <small>安いモデルでも構いません</small></b><input type="text" id="s_oxmodel" list="oml" value="${esc(s.oaiExtractModel || s.oaiModel || DEF_SET.oaiModel)}"></label>
        ` : `
        <p class="note">キーはこの端末のブラウザにだけ保存され、Google以外へは送信されません。</p>
        <label class="f"><b>Gemini APIキー</b><input type="password" id="s_key" value="${esc(gemKey())}" placeholder="AIza..."></label>
        <label class="f"><b>会話に使うモデル</b><input type="text" id="s_model" list="ml" value="${esc(s.model)}">
          <datalist id="ml">${MODELS.map(m => `<option value="${m}">`).join('')}</datalist></label>
        <label class="f"><b>記憶の抽出に使うモデル <small>安いモデルでも構いません</small></b><input type="text" id="s_xmodel" list="ml" value="${esc(s.extractModel)}"></label>
        `}
        <label class="f"><b>Temperature <small>ヨルの熱量。1が既定です</small></b><input type="number" id="s_temp" step="0.05" min="0" max="2" value="${s.temperature}"></label>
        <label class="f"><b>返答の最大トークン</b><input type="number" id="s_max" value="${s.maxOutputTokens}"></label>
        ${isOAI() ? `<p class="note">OpenAIは安全フィルタをAPIから緩められません。表現が止まる場合はGeminiに切り替えてください。</p>`
          : `<label class="f"><b><input type="checkbox" id="s_safe" ${s.safetyOff ? 'checked' : ''}> 安全フィルタを緩める</b></label>`}
      </div>
      <div class="card"><h3>記憶とコスト</h3>
        <label class="f"><b>毎回送る会話の往復数 <small>少ないほど安く済みます</small></b><input type="number" id="s_turns" min="2" max="60" value="${s.historyTurns}"></label>
        <label class="f"><b>思い出す記憶の件数 <small>上限</small></b><input type="number" id="s_topk" min="0" max="30" value="${s.memTopK}"></label>
        <label class="f"><b><input type="checkbox" id="s_tone" ${s.toneLayer ? 'checked' : ''}> 会話の空気に合わせて温度を補助する</b><small>既定でオフ。オンにすると呼びかけ・疲れ・喜びなどに応じた短いヒントを添えますが、人格設定と競合することがあります</small></label>
        <label class="f"><b><input type="checkbox" id="s_quick" ${s.quickOn !== false ? 'checked' : ''}> 返事のボタンを使う</b><small>入力欄の横の♡を押したときだけ、タップで送れる短い言葉が出ます。行頭に [状態] と書くと、セリフではなく状態として送られます</small></label>
        <label class="f"><b>ボタンの中身 <small>1行に1つ</small></b><textarea id="s_qw" style="min-height:150px">${esc(s.quickWords || '')}</textarea></label>
        <label class="f"><b><input type="checkbox" id="s_var" ${s.variety ? 'checked' : ''}> 展開のマンネリを避ける</b><small>親密な場面を検出したときだけ、入り口・流れ・主導権・温度・言葉選びを毎回変えるヒントを添えます</small></label>
      </div>
      <div class="card"><h3>基本のヨル人格</h3>
        <p class="note">すべての世界に共通で読み込まれます。ここを書き換えても記憶は消えません。</p>
        <label class="f"><b>名前</b><input type="text" id="p_name" value="${esc(P.name)}"></label>
        <label class="f"><b>あなたの呼び名</b><input type="text" id="p_user" value="${esc(P.userName)}"></label>
        <label class="f"><b>アイコンの文字</b><input type="text" id="p_av" maxlength="1" value="${esc(P.avatar)}"></label>
        <label class="f"><b>人格（システムプロンプト）</b><textarea id="p_text" style="min-height:220px">${esc(P.text)}</textarea></label>
      </div>
      <button class="btn" onclick="saveSettings()">保存する</button>
      <div class="card" style="margin-top:14px"><h3>バックアップ</h3>
        <p class="note">会話・記憶・設定をJSONで書き出します。APIキーは含みません。</p>
        <div class="row2"><button class="btn sec" onclick="exportAll()">書き出す</button><button class="btn sec" onclick="$('#imp').click()">読み込む</button></div>
        <input type="file" id="imp" accept="application/json,.json" style="display:none">
      </div>
    </div>`;
  $('#imp').addEventListener('change', importAll);
}
async function saveSettings() {
  collectForm();
  await saveSet(); await savePersona();
  toast('保存しました'); renderHome();
}

/* =============== backup =============== */
async function exportAll() {
  const data = {
    app: 'yoru-pwa', version: 1, exportedAt: new Date().toISOString(),
    persona: S.persona, settings: S.set,
    worlds: await dbAll('worlds'), rooms: await dbAll('rooms'),
    messages: await dbAll('messages'), memories: await dbAll('memories')
  };
  const b = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = `yoru-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('書き出しました');
}
async function importAll(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch (err) { toast('このファイルは読み込めませんでした'); return; }
  if (!d || !d.worlds) { toast('バックアップの形式が違います'); return; }
  const mode = confirm('「OK」＝今のデータに追加して読み込む\n「キャンセル」＝今のデータを全部消して置き換える');
  if (!mode) { if (!confirm('本当に今のデータをすべて消して置き換えますか？')) return; }
  if (!mode) {
    for (const s of ['worlds', 'rooms', 'messages', 'memories']) {
      for (const x of await dbAll(s)) await dbDel(s, x.id);
    }
  }
  const wmap = {}, rmap = {};
  for (const w of d.worlds) { const nw = { ...w }; if (mode) { nw.id = uid(); } wmap[w.id] = nw.id; await dbPut('worlds', nw); }
  for (const r of (d.rooms || [])) { const nr = { ...r, worldId: wmap[r.worldId] || r.worldId }; if (mode) nr.id = uid(); rmap[r.id] = nr.id; await dbPut('rooms', nr); }
  for (const m of (d.messages || [])) { const nm = { ...m, roomId: rmap[m.roomId] || m.roomId }; if (mode) delete nm.id; await dbPut('messages', nm); }
  for (const m of (d.memories || [])) { const nm = { ...m, worldId: wmap[m.worldId] || m.worldId, roomId: m.roomId ? (rmap[m.roomId] || m.roomId) : null }; if (mode) delete nm.id; await dbPut('memories', nm); }
  if (d.persona && confirm('人格と設定も読み込みますか？')) {
    await dbPut('meta', { k: 'persona', v: d.persona });
    if (d.settings) await dbPut('meta', { k: 'settings', v: d.settings });
  }
  await loadAll(); renderHome(); toast('読み込みました');
}

function togglePersonaBox() {
  const m = $('#w_pmode').value, b = $('#w_pbox');
  if (b) b.style.display = m === 'own' ? 'block' : 'none';
}

/* inline handlers need these on window */
Object.assign(window, { S, $ });

/* =============== boot =============== */
(async function boot() {
  await loadAll();
  renderHome();
  flushPending();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => { });
})();

</script>
